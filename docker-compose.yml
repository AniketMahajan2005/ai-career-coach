version: '3.9'

services:
  backend:
    build: ./backend
    container_name: career_coach_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8000
        - VITE_WS_URL=ws://localhost:8000
    container_name: career_coach_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
